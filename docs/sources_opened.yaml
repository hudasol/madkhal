# Public pages that were actually opened, with the date. Claims of kind `url` must point
# to an entry here. Pages that could not be opened are listed with opened: false and are
# never cited as SOURCED.
#
# Pages whose address or text names a real organisation are not listed here: the build rules
# allow such names only in docs/CONTEXT.md, which records each of those pages with its address,
# publication date and the date it was opened, and claims about them point to that document
# (D-013).
