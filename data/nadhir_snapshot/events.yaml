# Documented HAB-related desalination disruptions (and one documented-limitation case).
# Every field cites SOURCES.md IDs. Evidence status follows SOURCES.md: in this session every
# source could only be LOCATED by web search — page fetch was blocked (data/SOURCE_STATUS.md) —
# so all are UNVERIFIED unless upgraded from the project owner's research repository
# hudasol/HAB-hyperspectral (read-only; its bibliography.md / data-access-log.md record fetched,
# dated reads). Upgrades are marked "via HAB-hyperspectral" in SOURCES.md (added 2026-09-29).
#
# `dataset` says which frozen detector can score the event: olci_v1 (2018+) or modis_v1 (2003–2014).
# ACTIVITY-ONLY events have no usable single date (season/year precision): we report the detector's
# alert activity over the documented period instead of a lead time.
#
# t_ref = the date used as "the bloom reached the intake" for lead-time arithmetic.
# Where only a news report date is known, t_ref is the REPORT date, which is an UPPER BOUND on the
# true onset of impact: lead times against it are optimistic by up to (t_ref - t_ref_earliest) days.
# t_ref_earliest = earliest date consistent with the sources (for the lead-time uncertainty interval).

events:
  - id: E2008-FUJ
    name: "2008–09 Cochlodinium polykrikoides red tide — Fujairah SWRO shutdown"
    plants: ["Fujairah SWRO (co-located with thermal plant)"]
    intake_key: fujairah        # profiles.modis_v1.intakes.fujairah
    dataset: modis_v1
    lat: 25.14                  # ESTIMATED: Fujairah city coast, general gazetteer, not an intake survey
    lon: 56.36
    coord_status: ESTIMATED
    species: "Cochlodinium (Margalefidinium) polykrikoides"
    shutdown_start: "2008-08/2008-12"   # season-level: bloom on east coast from late Aug 2008
    shutdown_end: unknown
    date_precision: season
    first_sighting: "late August 2008, Dibba Al-Hassan (discoloration)"
    evidence: [S-RICHLEN2010, S-ZHAO2014, S-NATIONAL-DESALTHREAT, S-NATIONAL-REOPEN, S-NATIONAL-VEOLIA, S-IDA-DAF]
    evidence_status: "VERIFIED-SECONDARY (Fujairah plant losses during 2008–09 bloom: The National, via HAB-hyperspectral); shutdown dates UNVERIFIED"
    # No shutdown date exists in any source -> no lead time. Activity over the documented bloom:
    # from first sighting (late Aug 2008, S-ZHAO2014) through "eight months" (S-NATIONAL-REOPEN).
    bloom_period_start: "2008-08-21"
    bloom_period_end: "2009-04-30"
    evaluation: ACTIVITY-ONLY

