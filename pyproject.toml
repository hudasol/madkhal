[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madkhal"
version = "0.1.0"
description = "Decision support for a hypothetical SWRO intake from imperfect satellite algal bloom evidence (proposal seed, advisory only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Huda Mueen" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
madkhal = "madkhal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
madkhal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "req(id): links a test to a requirement ID (MK-<layer>-<nnn>)",
  "slow: excluded from the fast check",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["madkhal"]
branch = false

[tool.coverage.report]
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501", "B008"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["importlinter.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "madkhal"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layers point downward only (L7 api > L6 tasking > L5 lab > L4 decision > L3 plant > L2 estimator > L1 evidence > L0 contract > X core)"
type = "layers"
layers = [
  "madkhal.cli",
  "madkhal.api",
  "madkhal.tasking",
  "madkhal.lab",
  "madkhal.decision",
  "madkhal.plant",
  "madkhal.estimator",
  "madkhal.evidence",
  "madkhal.contract",
  "madkhal.core",
]

[[tool.importlinter.contracts]]
name = "Only the evidence layer reads the Nadhir snapshot"
type = "forbidden"
source_modules = [
  "madkhal.estimator",
  "madkhal.plant",
  "madkhal.decision",
  "madkhal.contract",
  "madkhal.core",
]
forbidden_modules = ["madkhal.evidence"]
